<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Tic Tac Toe</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

<header>
<h1>NEON TIC TAC TOE</h1>
<p>THE ULTIMATE X & O BATTLE</p>
</header>

<div class="scoreboard">
<div class="score">
<span>PLAYER X</span>
<h2 id="scoreX">0</h2>
</div>

<div class="score">
<span>DRAWS</span>
<h2 id="scoreD">0</h2>
</div>

<div class="score">
<span>PLAYER O</span>
<h2 id="scoreO">0</h2>
</div>
</div>

<h2 id="status">PLAYER X TURN</h2>

<div class="board" id="board">
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
</div>

<button id="restart" class="main-btn">RESTART GAME</button>
<button id="reset" class="secondary-btn">RESET SCORES</button>

<div id="ad-banner"></div>

</div>

<script type="module" src="js/game.js"></script>
</body>
</html>
